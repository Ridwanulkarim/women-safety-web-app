<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f9f8ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>SafeHaven — Personal Safety & SOS Dispatch Network</title>
    <meta name="description" content="Real-time emergency SOS distress broadcasting, hardware GPS telemetry, emergency hotlines, and verifiable evidence capture." />

    <!-- Synchronous theme initialization defaulting to clean white light mode -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('safehaven_theme_v2');
          var isDark = saved !== null ? JSON.parse(saved) : false;
          var root = document.documentElement;
          root.classList.toggle('dark', Boolean(isDark));
          root.classList.toggle('light', !isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Google Fonts: IBM Plex Sans + IBM Plex Mono + Inter + Hind Siliguri (Bengali) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS for map rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-[#f9f8ff] text-[#171717] dark:bg-[#141415] dark:text-[#ededed] font-sans antialiased selection:bg-[#e11d48]/20 selection:text-[#e11d48]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
